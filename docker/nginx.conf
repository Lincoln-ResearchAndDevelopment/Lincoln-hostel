server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;

    # ============================================
    # Security Headers
    # ============================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Uncomment when you have a domain with HTTPS:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ============================================
    # Gzip Compression
    # ============================================
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ============================================
    # Upload Size Limit
    # ============================================
    client_max_body_size 10M;

    # ============================================
    # Block access to sensitive files
    # ============================================
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    location ~* (?:\.(?:bak|config|dist|fla|inc|ini|log|md|psd|sh|sql|swp|twig|txt|xml|yml|yaml)|~)$ {
        deny all;
        return 404;
    }

    # Block PHP files in uploads directory
    location ~* /uploads/.*\.php$ {
        deny all;
        return 404;
    }

    # ============================================
    # Static Assets (cached aggressively)
    # ============================================
    location ~* \.(?:jpg|jpeg|gif|png|ico|svg|webp|css|js|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ============================================
    # Laravel Application
    # ============================================
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ============================================
    # PHP-FPM
    # ============================================
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_PROXY "";
    }

    # ============================================
    # Health Check Endpoint
    # ============================================
    location = /api/health {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # ============================================
    # Deny access to hidden files
    # ============================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
